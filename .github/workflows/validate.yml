name: Validate

on:
  pull_request:
    paths:
      - "catalog/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/**"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate mods repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository
        run: npm run validate

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate secrets scrubber
        run: |
          npm --prefix packages/secrets-scrubber install --ignore-scripts --no-audit --no-fund
          npm --prefix packages/secrets-scrubber test
          npm --prefix packages/secrets-scrubber run typecheck
